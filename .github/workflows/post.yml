name: Post due reels to Instagram
on:
  schedule:
    # GitHub often runs scheduled jobs hours late (a 07:35 run started at 12:47), so check every 30 min:
    # each run posts only what is due, so a late or skipped run is covered by the next one.
    - cron: "5,35 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python post_due.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Post due reels" && git push)
