name: Post due reels to Instagram
on:
  schedule:
    - cron: "35 7 * * *"   # 13:05 IST
    - cron: "35 13 * * *"  # 19:05 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency: post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python post_due.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Post due reels" && git push)
